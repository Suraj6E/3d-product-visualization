version: '3.8'
services:
  flask_app:
    image: 3d-product-app
    build:
      context: .
      dockerfile: Dockerfile
      # Adding build arguments for better package management
      args:
        - DEBIAN_FRONTEND=noninteractive
        - OPENCV_VERSION=4.8.0
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      - FLASK_ENV=production
      # Adding Python path to ensure OpenCV is found
      - PYTHONPATH=/usr/local/lib/python3.12/site-packages
    volumes:
      - app_logs:/app/logs
    secrets:
      - aws_credentials
      - google_credentials
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Adding resource limits to prevent container from consuming too much memory
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

volumes:
  app_logs:

secrets:
  aws_credentials:
    file: .aws_credentials.json
  google_credentials:
    file: .google_credentials.json
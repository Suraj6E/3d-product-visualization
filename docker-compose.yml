version: '3.8'

services:
  flask_app:
    image: 3d-product-app
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - 8000
    env_file:
      - .env.production
    environment:
      - FLASK_ENV=production
    volumes:
      - app_logs:/app/logs
    secrets:
      - aws_credentials
      - google_credentials
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - flask_app

volumes:
  app_logs:

secrets:
  aws_credentials:
    file: .aws_credentials.json
  google_credentials:
    file: .google_credentials.json
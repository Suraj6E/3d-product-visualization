<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Analysis Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>

<body>
    <div class="container">
        <header>
            <h1>Product Analysis Platform</h1>
        </header>

        <main>
            <!-- Upload Section -->
            <section class="upload-section">
                <h2>Upload New Products</h2>
                <div class="upload-form">
                    <input type="text" id="folder-name" placeholder="Folder Name" required>
                    <label for="file-input" class="file-input-label">
                        Choose Files
                        <input type="file" id="file-input" multiple accept="image/*">
                    </label>
                    <button id="upload-btn" class="primary-btn">Upload Files</button>
                </div>
            </section>

            <!-- Folders List -->
            <section class="folders-section">
                <h2>Product Folders</h2>
                <div class="folders-grid">
                    {% for folder in folders %}
                    <a href="{{ url_for('view_folder', folder_name=folder) }}" class="folder-card">
                        <h3>{{ folder }}</h3>
                    </a>
                    {% endfor %}
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.getElementById('file-input');
            const folderInput = document.getElementById('folder-name');
            const uploadBtn = document.getElementById('upload-btn');

            uploadBtn.addEventListener('click', async () => {
                const files = fileInput.files;
                const folderName = folderInput.value.trim();

                if (!files.length || !folderName) {
                    alert('Please select files and provide a folder name');
                    return;
                }

                const formData = new FormData();
                formData.append('folder_name', folderName);
                for (let file of files) {
                    formData.append('files[]', file);
                }

                try {
                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (data.success) {
                        window.location.href = data.redirect;
                    } else {
                        alert(data.message || 'Upload failed');
                    }
                } catch (error) {
                    console.error('Upload error:', error);
                    alert('Upload failed. Please try again.');
                }
            });
        });
    </script>
</body>

</html>

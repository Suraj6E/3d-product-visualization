<!-- templates/folder.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ folder_name }} - Product Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/folder.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body>
    <div class="container">
        <header class="folder-header">
            <a href="{{ url_for('index') }}" class="back-link">← Back to Folders</a>
            <h1>{{ folder_name }}</h1>
        </header>

        <main class="folder-content">
            <!-- Images Gallery -->
            <section class="images-section">
                <h2>Images</h2>
                <div class="images-grid">
                    {% for image in images %}
                    <div class="image-card" data-image="{{ image }}">
                        <img src="{{ url_for('static', filename='uploads/' + folder_name + '/' + image) }}"
                            alt="{{ image }}">
                        <div class="image-info">{{ image }}</div>
                    </div>
                    {% endfor %}
                </div>
            </section>

            <!-- 3D Visualization -->
            <section class="visualization-section">
                <h2>3D Analysis</h2>
                <div id="plot-container"></div>
                <button id="process-btn" class="primary-btn">Process Images</button>
            </section>

            <!-- Feedback Section -->
            <section class="feedback-section">
                <h2>Product Feedback</h2>
                <div class="feedback-form">
                    <div class="rating-container">
                        <label>Overall Rating:</label>
                        <div class="rating-buttons">
                            {% for i in range(1, 11) %}
                            <button class="rating-btn" data-rating="{{ i }}">{{ i }}</button>
                            {% endfor %}
                        </div>
                    </div>
                    <div class="comment-container">
                        <label for="feedback-comment">Your Analysis:</label>
                        <textarea id="feedback-comment" rows="4"
                            placeholder="Share your thoughts about this product's analysis..."></textarea>
                    </div>
                    <button id="submit-feedback" class="primary-btn">Submit Feedback</button>
                </div>
                <div class="feedback-history">
                    <h3>Previous Analysis</h3>
                    <div id="feedback-list"></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const processBtn = document.getElementById('process-btn');
            const submitFeedbackBtn = document.getElementById('submit-feedback');
            const folderName = '{{ folder_name }}';

            // Load existing feedback when page loads
            loadFolderFeedback();

            // Process button handler
            processBtn.addEventListener('click', async () => {
                processBtn.disabled = true;
                processBtn.textContent = 'Processing...';
                
                try {
                    const response = await fetch(`/process/${folderName}`);
                    const data = await response.json();
                    
                    if (data.success) {
                        Plotly.newPlot('plot-container', data.plot);
                    } else {
                        alert(data.message || 'Processing failed');
                    }
                } catch (error) {
                    console.error('Processing error:', error);
                    alert('Processing failed. Please try again.');
                } finally {
                    processBtn.disabled = false;
                    processBtn.textContent = 'Process Images';
                }
            });

            // Updated feedback submission handler
            submitFeedbackBtn.addEventListener('click', async () => {
                const selectedRating = document.querySelector('.rating-btn.selected');
                const comment = document.getElementById('feedback-comment').value;

                if (!selectedRating) {
                    alert('Please select a rating');
                    return;
                }

                if (!comment.trim()) {
                    alert('Please provide some analysis comments');
                    return;
                }

                const feedback = {
                    rating: parseInt(selectedRating.dataset.rating),
                    comment: comment,
                    timestamp: new Date().toISOString()
                };

                try {
                    const response = await fetch(`/feedback/${folderName}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(feedback)
                    });

                    const data = await response.json();

                    if (data.success) {
                        // Clear form
                        document.querySelectorAll('.rating-btn').forEach(btn =>
                            btn.classList.remove('selected'));
                        document.getElementById('feedback-comment').value = '';

                        // Reload feedback
                        loadFolderFeedback();
                        alert('Feedback saved successfully');
                    } else {
                        alert(data.error || 'Failed to save feedback');
                    }
                } catch (error) {
                    console.error('Feedback error:', error);
                    alert('Failed to save feedback. Please try again.');
                }
            });

            // Function to load folder feedback
            async function loadFolderFeedback() {
                try {
                    const response = await fetch(`/get_feedback/${folderName}`);
                    const data = await response.json();

                    const feedbackList = document.getElementById('feedback-list');
                    feedbackList.innerHTML = '';

                    if (data.feedback && data.feedback.length > 0) {
                        data.feedback.forEach(item => {
                            const feedbackItem = document.createElement('div');
                            feedbackItem.className = 'feedback-item';
                            feedbackItem.innerHTML = `
                                <div class="feedback-header">
                                    <span class="feedback-rating">Rating: ${item.rating}/10</span>
                                    <span class="feedback-time">
                                        ${new Date(item.timestamp).toLocaleString()}
                                    </span>
                                </div>
                                <div class="feedback-comment">${item.comment}</div>
                            `;
                            feedbackList.appendChild(feedbackItem);
                        });
                    } else {
                        feedbackList.innerHTML = '<p>No feedback yet for this product.</p>';
                    }
                } catch (error) {
                    console.error('Error loading feedback:', error);
                    document.getElementById('feedback-list').innerHTML =
                        '<p>Error loading feedback. Please try again later.</p>';
                }
            }

            // Rating button handlers
            document.querySelectorAll('.rating-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.rating-btn').forEach(b =>
                        b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
            });
        });
    </script>
</body>

</html>
